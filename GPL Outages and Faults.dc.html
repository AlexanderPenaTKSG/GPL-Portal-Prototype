<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/guyana-design-system-c46a8c74-8f2b-4863-94a3-6f22ebb3d937/colors_and_type.css">
<link rel="stylesheet" href="_ds/guyana-design-system-c46a8c74-8f2b-4863-94a3-6f22ebb3d937/styles.css">
<script src="_ds/guyana-design-system-c46a8c74-8f2b-4863-94a3-6f22ebb3d937/_ds_bundle.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #eef2f8; font-family: Inter, system-ui, sans-serif; }
  a { color: #404293; text-decoration: none; }
  a:hover { color: #323373; }
</style>
</helmet>
<dc-import name="GPL Service Requests" embedded="{{ embedded }}" mode="outages" intent="{{ intent }}" report-intent="{{ reportIntent }}" rail-width="{{ railWidth }}" hint-size="100%,900px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;embedded&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;intent&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;reportIntent&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;railWidth&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    // Outages & faults is its own page: this file is the dedicated entry
    // point (openable standalone with its own header), while internally
    // reusing the Service Requests module's outages mode so the tabs,
    // status check, reporting form and case tracking stay in one place.
    return {
      embedded: this.props.embedded === true,
      intent: this.props.intent || null,
      reportIntent: this.props.reportIntent || null,
      railWidth: this.props.railWidth
    };
  }
}
</script>
</body>
</html>
