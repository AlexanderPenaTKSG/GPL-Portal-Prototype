document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"10f3f904-0041-4e53-a642-c3bbc57e17fa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"898bcb07-44b9-4231-af93-72c2c37f0ce4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ======================================================================\n     1. TYPE FAMILIES\n     ====================================================================== */\n  --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace;\n\n  /* ======================================================================\n     2. TYPE SCALE  (tuned for UI; px for clean design-tool export)\n     ====================================================================== */\n  --text-2xs: 13px;  /* smallest functional label */\n  --text-xs:  14px;  /* captions, meta */\n  --text-sm:  15px;  /* secondary body, dense UI */\n  --text-base:17px;  /* body */\n  --text-md:  19px;  /* lead body */\n  --text-lg:  23px;  /* card titles */\n  --text-xl:  28px;  /* section headings */\n  --text-2xl: 36px;  /* page titles */\n  --text-3xl: 48px;  /* hero */\n  --text-4xl: 64px;  /* display */\n\n  --leading-tight: 1.12;\n  --leading-snug:  1.3;\n  --leading-normal:1.55;\n  --leading-relaxed:1.7;\n\n  --tracking-tight: -0.02em;\n  --tracking-snug:  -0.01em;\n  --tracking-normal:0;\n  --tracking-wide:  0.04em;\n  --tracking-caps:  0.08em;  /* eyebrow / overline */\n\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semibold:600;\n  --weight-bold:    700;\n  --weight-extra:   800;\n\n  /* ======================================================================\n     3. NEUTRAL PALETTE  (institutional ink + paper — cool, slightly blue-grey)\n     ====================================================================== */\n  --neutral-0:   #ffffff;\n  --neutral-50:  #f6f8fb;\n  --neutral-100: #eef2f7;\n  --neutral-150: #e4eaf2;\n  --neutral-200: #d6deea;\n  --neutral-300: #b9c4d6;\n  --neutral-400: #94a2b8;\n  --neutral-500: #6b7a93;\n  --neutral-600: #4e5d75;\n  --neutral-700: #38445a;\n  --neutral-800: #232e42;\n  --neutral-900: #131c2e;\n  --neutral-950: #0a1120;\n\n  /* ======================================================================\n     4. SEMANTIC INK / SURFACE  (foreground + background roles)\n     ====================================================================== */\n  --fg-1: var(--neutral-900);   /* primary text */\n  --fg-2: var(--neutral-800);   /* secondary text */\n  --fg-3: var(--neutral-600);   /* tertiary / meta */\n  --fg-4: var(--neutral-500);   /* disabled / placeholder — still readable */\n  --fg-on-accent: #ffffff;      /* text on a filled accent button */\n\n  --bg-page:  #eef2f8;          /* app canvas behind cards */\n  --bg-subtle:var(--neutral-50);/* alternate zebra / inset ground */\n  --bg-solid: var(--neutral-0); /* solid surface fallback */\n\n  /* ======================================================================\n     5. SURFACE SYSTEM  ★ FLAT & SOLID (glassmorphism removed)\n        Cards and chrome are opaque. The old --glass-* names are kept as\n        compatibility ALIASES so existing components keep resolving — they\n        now point at solid fills, and the blur tokens resolve to `none`.\n        Prefer the --surface-* names in new work.\n     ====================================================================== */\n  --surface-1: var(--neutral-0);    /* primary card / panel */\n  --surface-2: var(--neutral-50);   /* rails, inset regions */\n  --surface-3: var(--neutral-0);    /* content panels */\n  --surface-4: var(--neutral-100);  /* chips, faint fills */\n\n  --surface-border:      rgba(19, 28, 46, 0.10);\n  --surface-border-soft: rgba(19, 28, 46, 0.06);\n  --surface-hairline:    rgba(19, 28, 46, 0.08);\n\n  /* Legacy aliases (glass removed → solid). Blur is now a no-op. */\n  --glass-bg-1: var(--surface-1);\n  --glass-bg-2: var(--surface-1);\n  --glass-bg-3: var(--surface-1);\n  --glass-bg-4: var(--surface-4);\n  --glass-border:      var(--surface-border);\n  --glass-border-soft: var(--surface-border-soft);\n  --glass-hairline:    var(--surface-hairline);\n  --glass-blur:        none;   /* @kind other */\n  --glass-blur-strong: none;   /* @kind other */\n  --glass-blur-light:  none;   /* @kind other */\n  --glass-sheen: none;         /* @kind other */\n  --glass-inner: none;         /* @kind other */\n\n  /* ======================================================================\n     6. ELEVATION  (soft, diffuse — flat cards that lift on interaction)\n     ====================================================================== */\n  --shadow-xs: 0 1px 2px rgba(19, 28, 46, 0.05);\n  --shadow-sm: 0 1px 3px rgba(19, 28, 46, 0.06);\n  --shadow-md: 0 3px 8px rgba(19, 28, 46, 0.07), 0 1px 2px rgba(19, 28, 46, 0.05);\n  --shadow-lg: 0 6px 16px rgba(19, 28, 46, 0.08), 0 2px 6px rgba(19, 28, 46, 0.05);\n  --shadow-xl: 0 12px 30px rgba(19, 28, 46, 0.10), 0 4px 10px rgba(19, 28, 46, 0.06);\n  /* Accent-tinted glow for hovered/active accent surfaces (micro-interaction) */\n  --shadow-accent: 0 8px 22px var(--agency-accent-ring);\n  --elevation-glass: var(--shadow-md);  /* legacy alias — now just the shadow */\n\n  /* ======================================================================\n     7. RADII  (soft, modern — generous but not bubbly)\n     ====================================================================== */\n  --radius-xs:  6px;\n  --radius-sm:  8px;\n  --radius-md:  12px;\n  --radius-lg:  16px;\n  --radius-xl:  20px;\n  --radius-2xl: 28px;\n  --radius-pill:999px;\n\n  /* ======================================================================\n     8. SPACING  (4px base grid)\n     ====================================================================== */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-16:64px;\n  --space-20:80px;\n  --space-24:96px;\n\n  /* ======================================================================\n     9. MOTION  ★ micro-interactions are a first-class citizen\n        Use --ease-spring for selection/press pops, --ease-out for moves,\n        --ease-emphasis for entrances. Keep durations short & snappy.\n     ====================================================================== */\n  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);       /* @kind other */\n  --ease-in-out:   cubic-bezier(0.65, 0, 0.35, 1);      /* @kind other */\n  --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);   /* @kind other */\n  --ease-emphasis: cubic-bezier(0.2, 0.9, 0.25, 1.15);  /* @kind other */\n  --ease-glass:    var(--ease-out);                     /* @kind other */\n  --dur-snap:  120ms;   /* @kind other */\n  --dur-fast:  180ms;   /* @kind other */\n  --dur-base:  260ms;   /* @kind other */\n  --dur-slow:  420ms;   /* @kind other */\n  /* Ready-made transition recipes */\n  --tr-control: transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);\n  --tr-surface: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);\n\n  /* ======================================================================\n     10. STATUS / FEEDBACK  (semantic, agency-independent)\n     ====================================================================== */\n  --status-success: #1f8a5b;\n  --status-success-bg: rgba(31, 138, 91, 0.12);\n  --status-warning: #c47d12;\n  --status-warning-bg: rgba(196, 125, 18, 0.14);\n  --status-error:   #c43d3d;\n  --status-error-bg: rgba(196, 61, 61, 0.12);\n  --status-info:    #2a6fdb;\n  --status-info-bg: rgba(42, 111, 219, 0.12);\n\n  /* ======================================================================\n     11. AGENCY THEME HOOKS  ★ the per-agency override surface\n        Override these six hooks on any scope (data-agency / inline style)\n        to re-skin everything. Default below = Ministry of Finance.\n     ====================================================================== */\n  --agency-accent:       #0f7a52;  /* primary brand color */\n  --agency-accent-strong:#0b5c3e;  /* hover / pressed / deep fills */\n  --agency-accent-soft:  rgba(15, 122, 82, 0.12);   /* tints, selected bg */\n  --agency-accent-ring:  rgba(15, 122, 82, 0.30);   /* focus ring, glow */\n  --agency-tint:         #0f7a52;  /* ambient background tint */\n  --agency-contrast:     #ffffff;  /* text on filled accent */\n}\n\n/* ============================================================================\n   AGENCY THEMES — apply with  data-agency=\"…\"\n   One vivid, accessible accent per agency. The flat shell stays identical;\n   only these hooks change.\n   ============================================================================ */\n\n/* Ministry of Finance — emerald (default) */\n[data-agency=\"finance\"], [data-agency=\"national\"] {\n  --agency-accent: #0f7a52;  --agency-accent-strong: #0b5c3e;\n  --agency-accent-soft: rgba(15,122,82,0.12); --agency-accent-ring: rgba(15,122,82,0.30);\n  --agency-tint: #0f7a52; --agency-contrast: #ffffff;\n}\n/* Guyana Revenue Authority (GRA) — royal blue */\n[data-agency=\"revenue\"], [data-agency=\"gra\"] {\n  --agency-accent: #2563c9;  --agency-accent-strong: #1b4a9c;\n  --agency-accent-soft: rgba(37,99,201,0.12); --agency-accent-ring: rgba(37,99,201,0.30);\n  --agency-tint: #2563c9; --agency-contrast: #ffffff;\n}\n/* Home Affairs — General Register Office (GRO) — plum */\n[data-agency=\"gro\"] {\n  --agency-accent: #8a3fa8;  --agency-accent-strong: #6d2f86;\n  --agency-accent-soft: rgba(138,63,168,0.12); --agency-accent-ring: rgba(138,63,168,0.30);\n  --agency-tint: #8a3fa8; --agency-contrast: #ffffff;\n}\n/* Home Affairs — Central Immigration & Passport Office — indigo navy */\n[data-agency=\"immigration\"], [data-agency=\"passport\"] {\n  --agency-accent: #3a45b0;  --agency-accent-strong: #2b3488;\n  --agency-accent-soft: rgba(58,69,176,0.12); --agency-accent-ring: rgba(58,69,176,0.30);\n  --agency-tint: #3a45b0; --agency-contrast: #ffffff;\n}\n/* Ministry of Human Services & Social Security — rose */\n[data-agency=\"human-services\"], [data-agency=\"social\"] {\n  --agency-accent: #c2365f;  --agency-accent-strong: #9c2b4d;\n  --agency-accent-soft: rgba(194,54,95,0.12); --agency-accent-ring: rgba(194,54,95,0.30);\n  --agency-tint: #c2365f; --agency-contrast: #ffffff;\n}\n/* National Insurance Scheme (NIS) — green */\n[data-agency=\"nis\"] {\n  --agency-accent: #1f7a4d;  --agency-accent-strong: #175d3a;\n  --agency-accent-soft: rgba(31,122,77,0.12); --agency-accent-ring: rgba(31,122,77,0.30);\n  --agency-tint: #1f7a4d; --agency-contrast: #ffffff;\n}\n/* Ministry of Housing & Water (CH&PA) — warm amber-terracotta */\n[data-agency=\"housing\"], [data-agency=\"chpa\"] {\n  --agency-accent: #b45f16;  --agency-accent-strong: #8c4910;\n  --agency-accent-soft: rgba(180,95,22,0.14); --agency-accent-ring: rgba(180,95,22,0.32);\n  --agency-tint: #c86f1e; --agency-contrast: #ffffff;\n}\n/* All Ministry — Appointments (cross-government) — violet */\n[data-agency=\"appointments\"] {\n  --agency-accent: #6d4bd8;  --agency-accent-strong: #543aad;\n  --agency-accent-soft: rgba(109,75,216,0.12); --agency-accent-ring: rgba(109,75,216,0.30);\n  --agency-tint: #6d4bd8; --agency-contrast: #ffffff;\n}\n\n/* ============================================================================\n   SEMANTIC TEXT ROLES — apply as classes (h1…caption) or copy into components.\n   ============================================================================ */\n.ds-display {\n  font-family: var(--font-sans); font-weight: var(--weight-extra);\n  font-size: var(--text-4xl); line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight); color: var(--fg-1);\n}\n.ds-h1 {\n  font-family: var(--font-sans); font-weight: var(--weight-bold);\n  font-size: var(--text-2xl); line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight); color: var(--fg-1);\n}\n.ds-h2 {\n  font-family: var(--font-sans); font-weight: var(--weight-bold);\n  font-size: var(--text-xl); line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-snug); color: var(--fg-1);\n}\n.ds-h3 {\n  font-family: var(--font-sans); font-weight: var(--weight-semibold);\n  font-size: var(--text-lg); line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-snug); color: var(--fg-1);\n}\n.ds-lead {\n  font-family: var(--font-sans); font-weight: var(--weight-regular);\n  font-size: var(--text-md); line-height: var(--leading-relaxed); color: var(--fg-2);\n}\n.ds-body {\n  font-family: var(--font-sans); font-weight: var(--weight-regular);\n  font-size: var(--text-base); line-height: var(--leading-normal); color: var(--fg-2);\n}\n.ds-small {\n  font-family: var(--font-sans); font-weight: var(--weight-medium);\n  font-size: var(--text-sm); line-height: var(--leading-normal); color: var(--fg-2);\n}\n.ds-caption {\n  font-family: var(--font-sans); font-weight: var(--weight-medium);\n  font-size: var(--text-xs); line-height: var(--leading-normal); color: var(--fg-3);\n}\n.ds-eyebrow {\n  font-family: var(--font-sans); font-weight: var(--weight-bold);\n  font-size: var(--text-xs); line-height: 1; letter-spacing: var(--tracking-caps);\n  text-transform: uppercase; color: var(--agency-accent);\n}\n.ds-mono {\n  font-family: var(--font-mono); font-size: var(--text-sm); color: var(--fg-2);\n}\n\n/* ============================================================================\n   SURFACE UTILITY — the reusable flat, solid surface recipe.\n   Compose: <div class=\"surface\"> … <\u002Fdiv>  (.glass kept as a legacy alias)\n   Opaque card with a hairline + soft shadow. No blur, no sheen.\n   ============================================================================ */\n.surface, .glass {\n  position: relative;\n  background: var(--surface-1);\n  border: 1px solid var(--surface-border);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-md);\n}\n.glass--2, .surface--2 { background: var(--surface-2); }\n.glass--3, .surface--3 { background: var(--surface-3); }\n.glass--4, .surface--4 { background: var(--surface-4); box-shadow: var(--shadow-sm); }\n/* Legacy frost opt-ins are now no-ops (glassmorphism removed) */\n.glass--frost, .glass--strong { -webkit-backdrop-filter: none; backdrop-filter: none; }\n\n/* ============================================================================\n   MICRO-INTERACTIONS — snappy, spring-eased feedback on every control.\n   Add .interactive to any card/tile; .press to any button/pressable.\n   Respects reduced-motion.\n   ============================================================================ */\n.interactive {\n  transition: var(--tr-surface);\n  cursor: pointer;\n  will-change: transform;\n}\n.interactive:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }\n.interactive:active { transform: translateY(-1px) scale(0.995); transition-duration: var(--dur-snap); }\n\n.press {\n  transition: var(--tr-control);\n  will-change: transform;\n}\n.press:hover { transform: translateY(-1px); }\n.press:active { transform: translateY(0) scale(0.96); transition-duration: var(--dur-snap); }\n\n/* Accent focus ring — expressive, animated */\n.focus-ring:focus-visible {\n  outline: none;\n  box-shadow: 0 0 0 3px var(--agency-accent-ring);\n  transition: box-shadow var(--dur-fast) var(--ease-out);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .interactive, .press, .focus-ring, * {\n    transition-duration: 1ms !important;\n    animation-duration: 1ms !important;\n  }\n  .interactive:hover, .press:hover { transform: none; }\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   GUYANA GOVERNMENT PORTAL — Design System\n   styles.css  —  ROOT ENTRY POINT\n\n   The single stylesheet a consuming project should link. It pulls in the\n   token source of truth (colors_and_type.css): the type scale, neutral\n   palette, glass system, elevation, radii, spacing, motion, status colors,\n   the per-agency theme hooks, and the ready-to-use .ds-* text roles +\n   .glass utility.\n\n       <link rel=\"stylesheet\" href=\"styles.css\">\n\n   Then set a theme on any scope:  <div data-agency=\"health\"> … <\u002Fdiv>\n\n   The other CSS files in this repo are local scaffolding, NOT for consumers:\n     • preview/_preview.css                — specimen-card backdrop only\n     • ui_kits/launcher-dashboard/portal.css — the demo UI-kit prototype\n     • figma/board.css                     — Figma-export board styling\n   ========================================================================== */\n\n/* ==========================================================================\n   GUYANA GOVERNMENT PORTAL — Design System Foundations\n   colors_and_type.css\n\n   A modern, light-mode token system for a whole-of-government unified portal.\n   Front-end target: React Native (Generic RN + Reanimated / Tamagui). These\n   CSS custom properties are the single source of truth; RN themes map 1:1 to\n   the same names.\n\n   DESIGN INTENT (v3 — flat & modern):\n   Flat, SOLID surfaces (no glassmorphism), generous rounding, calm neutral\n   ink, and one vivid accent per agency. Motion is a first-class citizen:\n   snappy, spring-eased micro-interactions on every control (hover lift,\n   press, focus, selection) — expressive but purposeful, never noisy.\n   Sizes are defined in px (not rem) so design-tool / Figma exports read as\n   clean pixel values.\n\n   Load order:\n     1. @import this file (or <link>) — defines :root tokens + agency themes\n     2. Set a theme on any scope:  <div data-agency=\"revenue\"> … <\u002Fdiv>\n   ========================================================================== */\n\n/* ----------------------------------------------------------------------------\n   FONTS — Manrope (Google Fonts CDN). See README for vendoring instructions.\n   ---------------------------------------------------------------------------- */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7a78e4ff-64e1-4ca8-b878-962d2d29c332\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"73c51316-8596-4dc8-8cee-41c1c0be5901\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ddbde987-00f0-4548-a0b3-a8beb2d96565\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"24ff168f-b1d5-4ecb-a1ee-2baf6084edd0\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style \n  src: url(\"24ff168f-b1d5-4ecb-a1ee-2baf6084edd0\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"2525accb-cdd8-41ed-88d3-0c6cb0f473a9\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"10f3f904-0041-4e53-a642-c3bbc57e17fa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"898bcb07-44b9-4231-af93-72c2c37f0ce4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7a78e4ff-64e1-4ca8-b878-962d2d29c332\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"73c51316-8596-4dc8-8cee-41c1c0be5901\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 600;\n  font-di   unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"73c51316-8596-4dc8-8cee-41c1c0be5901\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"ddbde987-00f0-4548-a0b3-a8beb2d96565\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"24ff168f-b1d5-4ecb-a1ee-2baf6084edd0\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"2525accb-cdd8-41ed-88d3-0c6cb0f473a9\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"10f3f904-0041-4e53-a642-c3bbc57e17fa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"898bcb07-44b9-4231-af93-72c2c37f0ce4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ======================================================================\n     1. TYPE FAMILIES\n     ====================================================================== */\n  --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace;\n\n  /* ======================================================================\n     2. TYPE SCALE  (tuned for UI; px for clean design-tool export)\n     ====================================================================== */\n  --text-2xs: 13px;  /* smallest functional label */\n  --text-xs:  14px;  /* captions, meta */\n  --text-sm:  15px;  /* secondary body, dense UI */\n  --text-base:17px;  /* body */\n  --text-md:  19px;  /* lead body */\n  --text-lg:  23px;  /* card titles */\n  --text-xl:  28px;  /* section headings */\n  --text-2xl: 36px;  /* page titles */\n  --text-3xl: 48px;  /* hero */\n  --text-4xl: 64px;  /* display */\n\n  --leading-tight: 1.12;\n  --leading-snug:  1.3;\n  --leading-normal:1.55;\n  --leading-relaxed:1.7;\n\n  --tracking-tight: -0.02em;\n  --tracking-snug:  -0.01em;\n  --tracking-normal:0;\n  --tracking-wide:  0.04em;\n  --tracking-caps:  0.08em;  /* eyebrow / overline */\n\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semibold:600;\n  --weight-bold:    700;\n  --weight-extra:   800;\n\n  /* ======================================================================\n     3. NEUTRAL PALETTE  (institutional ink + paper — cool, slightly blue-grey)\n     ====================================================================== */\n  --neutral-0:   #ffffff;\n  --neutral-50:  #f6f8fb;\n  --neutral-100: #eef2f7;\n  --neutral-150: #e4eaf2;\n  --neutral-200: #d6deea;\n  --neutral-300: #b9c4d6;\n  --neutral-400: #94a2b8;\n  --neutral-500: #6b7a93;\n  --neutral-600: #4e5d75;\n  --neutral-700: #38445a;\n  --neutral-800: #232e42;\n  --neutral-900: #131c2e;\n  --neutral-950: #0a1120;\n\n  /* ======================================================================\n     4. SEMANTIC INK / SURFACE  (foreground + background roles)\n     ====================================================================== */\n  --fg-1: var(--neutral-900);   /* primary text */\n  --fg-2: var(--neutral-800);   /* secondary text */\n  --fg-3: var(--neutral-600);   /* tertiary / meta */\n  --fg-4: var(--neutral-500);   /* disabled / placeholder — still readable */\n  --fg-on-accent: #ffffff;      /* text on a filled accent button */\n\n  --bg-page:  #eef2f8;          /* app canvas behind cards */\n  --bg-subtle:var(--neutral-50);/* alternate zebra / inset ground */\n  --bg-solid: var(--neutral-0); /* solid surface fallback */\n\n  /* ======================================================================\n     5. SURFACE SYSTEM  ★ FLAT & SOLID (glassmorphism removed)\n        Cards and chrome are opaque. The old --glass-* names are kept as\n        compatibility ALIASES so existing components keep resolving — they\n        now point at solid fills, and the blur tokens resolve to `none`.\n        Prefer the --surface-* names in new work.\n     ====================================================================== */\n  --surface-1: var(--neutral-0);    /* primary card / panel */\n  --surface-2: var(--neutral-50);   /* rails, inset regions */\n  --surface-3: var(--neutral-0);    /* content panels */\n  --surface-4: var(--neutral-100);  /* chips, faint fills */\n\n  --surface-border:      rgba(19, 28, 46, 0.10);\n  --surface-border-soft: rgba(19, 28, 46, 0.06);\n  --surface-hairline:    rgba(19, 28, 46, 0.08);\n\n  /* Legacy aliases (glass removed → solid). Blur is now a no-op. */\n  --glass-bg-1: var(--surface-1);\n  --glass-bg-2: var(--surface-1);\n  --glass-bg-3: var(--surface-1);\n  --glass-bg-4: var(--surface-4);\n  --glass-border:      var(--surface-border);\n  --glass-border-soft: var(--surface-border-soft);\n  --glass-hairline:    var(--surface-hairline);\n  --glass-blur:        none;   /* @kind other */\n  --glass-blur-strong: none;   /* @kind other */\n  --glass-blur-light:  none;   /* @kind other */\n  --glass-sheen: none;         /* @kind other */\n  --glass-inner: none;         /* @kind other */\n\n  /* ======================================================================\n     6. ELEVATION  (soft, diffuse — flat cards that lift on interaction)\n     ====================================================================== */\n  --shadow-xs: 0 1px 2px rgba(19, 28, 46, 0.05);\n  --shadow-sm: 0 1px 3px rgba(19, 28, 46, 0.06);\n  --shadow-md: 0 3px 8px rgba(19, 28, 46, 0.07), 0 1px 2px rgba(19, 28, 46, 0.05);\n  --shadow-lg: 0 6px 16px rgba(19, 28, 46, 0.08), 0 2px 6px rgba(19, 28, 46, 0.05);\n  --shadow-xl: 0 12px 30px rgba(19, 28, 46, 0.10), 0 4px 10px rgba(19, 28, 46, 0.06);\n  /* Accent-tinted glow for hovered/active accent surfaces (micro-interaction) */\n  --shadow-accent: 0 8px 22px var(--agency-accent-ring);\n  --elevation-glass: var(--shadow-md);  /* legacy alias — now just the shadow */\n\n  /* ======================================================================\n     7. RADII  (soft, modern — generous but not bubbly)\n     ====================================================================== */\n  --radius-xs:  6px;\n  --radius-sm:  8px;\n  --radius-md:  12px;\n  --radius-lg:  16px;\n  --radius-xl:  20px;\n  --radius-2xl: 28px;\n  --radius-pill:999px;\n\n  /* ======================================================================\n     8. SPACING  (4px base grid)\n     ====================================================================== */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-16:64px;\n  --space-20:80px;\n  --space-24:96px;\n\n  /* ======================================================================\n     9. MOTION  ★ micro-interactions are a first-class citizen\n        Use --ease-spring for selection/press pops, --ease-out for moves,\n        --ease-emphasis for entrances. Keep durations short & snappy.\n     ====================================================================== */\n  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);       /* @kind other */\n  --ease-in-out:   cubic-bezier(0.65, 0, 0.35, 1);      /* @kind other */\n  --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);   /* @kind other */\n  --ease-emphasis: cubic-bezier(0.2, 0.9, 0.25, 1.15);  /* @kind other */\n  --ease-glass:    var(--ease-out);                     /* @kind other */\n  --dur-snap:  120ms;   /* @kind other */\n  --dur-fast:  180ms;   /* @kind other */\n  --dur-base:  260ms;   /* @kind other */\n  --dur-slow:  420ms;   /* @kind other */\n  /* Ready-made transition recipes */\n  --tr-control: transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);\n  --tr-surface: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);\n\n  /* ======================================================================\n     10. STATUS / FEEDBACK  (semantic, agency-independent)\n     ====================================================================== */\n  --status-success: #1f8a5b;\n  --status-success-bg: rgba(31, 138, 91, 0.12);\n  --status-warning: #c47d12;\n  --status-warning-bg: rgba(196, 125, 18, 0.14);\n  --status-error:   #c43d3d;\n  --status-error-bg: rgba(196, 61, 61, 0.12);\n  --status-info:    #2a6fdb;\n  --status-info-bg: rgba(42, 111, 219, 0.12);\n\n  /* ======================================================================\n     11. AGENCY THEME HOOKS  ★ the per-agency override surface\n        Override these six hooks on any scope (data-agency / inline style)\n        to re-skin everything. Default below = Ministry of Finance.\n     ====================================================================== */\n  --agency-accent:       #0f7a52;  /* primary brand color */\n  --agency-accent-strong:#0b5c3e;  /* hover / pressed / deep fills */\n  --agency-accent-soft:  rgba(15, 122, 82, 0.12);   /* tints, selected bg */\n  --agency-accent-ring:  rgba(15, 122, 82, 0.30);   /* focus ring, glow */\n  --agency-tint:         #0f7a52;  /* ambient background tint */\n  --agency-contrast:     #ffffff;  /* text on filled accent */\n}\n\n/* ============================================================================\n   AGENCY THEMES — apply with  data-agency=\"…\"\n   One vivid, accessible accent per agency. The flat shell stays identical;\n   only these hooks change.\n   ============================================================================ */\n\n/* Ministry of Finance — emerald (default) */\n[data-agency=\"finance\"], [data-agency=\"national\"] {\n  --agency-accent: #0f7a52;  --agency-accent-strong: #0b5c3e;\n  --agency-accent-soft: rgba(15,122,82,0.12); --agency-accent-ring: rgba(15,122,82,0.30);\n  --agency-tint: #0f7a52; --agency-contrast: #ffffff;\n}\n/* Guyana Revenue Authority (GRA) — royal blue */\n[data-agency=\"revenue\"], [data-agency=\"gra\"] {\n  --agency-accent: #2563c9;  --agency-accent-strong: #1b4a9c;\n  --agency-accent-soft: rgba(37,99,201,0.12); --agency-accent-ring: rgba(37,99,201,0.30);\n  --agency-tint: #2563c9; --agency-contrast: #ffffff;\n}\n/* Home Affairs — General Register Office (GRO) — plum */\n[data-agency=\"gro\"] {\n  --agency-accent: #8a3fa8;  --agency-accent-strong: #6d2f86;\n  --agency-accent-soft: rgba(138,63,168,0.12); --agency-accent-ring: rgba(138,63,168,0.30);\n  --agency-tint: #8a3fa8; --agency-contrast: #ffffff;\n}\n/* Home Affairs — Central Immigration & Passport Office — indigo navy */\n[data-agency=\"immigration\"], [data-agency=\"passport\"] {\n  --agency-accent: #3a45b0;  --agency-accent-strong: #2b3488;\n  --agency-accent-soft: rgba(58,69,176,0.12); --agency-accent-ring: rgba(58,69,176,0.30);\n  --agency-tint: #3a45b0; --agency-contrast: #ffffff;\n}\n/* Ministry of Human Services & Social Security — rose */\n[data-agency=\"human-services\"], [data-agency=\"social\"] {\n  --agency-accent: #c2365f;  --agency-accent-strong: #9c2b4d;\n  --agency-accent-soft: rgba(194,54,95,0.12); --agency-accent-ring: rgba(194,54,95,0.30);\n  --agency-tint: #c2365f; --agency-contrast: #ffffff;\n}\n/* National Insurance Scheme (NIS) — green */\n[data-agency=\"nis\"] {\n  --agency-accent: #1f7a4d;  --agency-accent-strong: #175d3a;\n  --agency-accent-soft: rgba(31,122,77,0.12); --agency-accent-ring: rgba(31,122,77,0.30);\n  --agency-tint: #1f7a4d; --agency-contrast: #ffffff;\n}\n/* Ministry of Housing & Water (CH&PA) — warm amber-terracotta */\n[data-agency=\"housing\"], [data-agency=\"chpa\"] {\n  --agency-accent: #b45f16;  --agency-accent-strong: #8c4910;\n  --agency-accent-soft: rgba(180,95,22,0.14); --agency-accent-ring: rgba(180,95,22,0.32);\n  --agency-tint: #c86f1e; --agency-contrast: #ffffff;\n}\n/* All Ministry — Appointments (cross-government) — violet */\n[data-agency=\"appointments\"] {\n  --agency-accent: #6d4bd8;  --agency-accent-strong: #543aad;\n  --agency-accent-soft: rgba(109,75,216,0.12); --agency-accent-ring: rgba(109,75,216,0.30);\n  --agency-tint: #6d4bd8; --agency-contrast: #ffffff;\n}\n\n/* ============================================================================\n   SEMANTIC TEXT ROLES — apply as classes (h1…caption) or copy into components.\n   ============================================================================ */\n.ds-display {\n  font-family: var(--font-sans); font-weight: var(--weight-extra);\n  font-size: var(--text-4xl); line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight); color: var(--fg-1);\n}\n.ds-h1 {\n  font-family: var(--font-sans); font-weight: var(--weight-bold);\n  font-size: var(--text-2xl); line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight); color: var(--fg-1);\n}\n.ds-h2 {\n  font-family: var(--font-sans); font-weight: var(--weight-bold);\n  font-size: var(--text-xl); line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-snug); color: var(--fg-1);\n}\n.ds-h3 {\n  font-family: var(--font-sans); font-weight: var(--weight-semibold);\n  font-size: var(--text-lg); line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-snug); color: var(--fg-1);\n}\n.ds-lead {\n  font-family: var(--font-sans); font-weight: var(--weight-regular);\n  font-size: var(--text-md); line-height: var(--leading-relaxed); color: var(--fg-2);\n}\n.ds-body {\n  font-family: var(--font-sans); font-weight: var(--weight-regular);\n  font-size: var(--text-base); line-height: var(--leading-normal); color: var(--fg-2);\n}\n.ds-small {\n  font-family: var(--font-sans); font-weight: var(--weight-medium);\n  font-size: var(--text-sm); line-height: var(--leading-normal); color: var(--fg-2);\n}\n.ds-caption {\n  font-family: var(--font-sans); font-weight: var(--weight-medium);\n  font-size: var(--text-xs); line-height: var(--leading-normal); color: var(--fg-3);\n}\n.ds-eyebrow {\n  font-family: var(--font-sans); font-weight: var(--weight-bold);\n  font-size: var(--text-xs); line-height: 1; letter-spacing: var(--tracking-caps);\n  text-transform: uppercase; color: var(--agency-accent);\n}\n.ds-mono {\n  font-family: var(--font-mono); font-size: var(--text-sm); color: var(--fg-2);\n}\n\n/* ============================================================================\n   SURFACE UTILITY — the reusable flat, solid surface recipe.\n   Compose: <div class=\"surface\"> … <\u002Fdiv>  (.glass kept as a legacy alias)\n   Opaque card with a hairline + soft shadow. No blur, no sheen.\n   ============================================================================ */\n.surface, .glass {\n  position: relative;\n  background: var(--surface-1);\n  border: 1px solid var(--surface-border);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-md);\n}\n.glass--2, .surface--2 { background: var(--surface-2); }\n.glass--3, .surface--3 { background: var(--surface-3); }\n.glass--4, .surface--4 { background: var(--surface-4); box-shadow: var(--shadow-sm); }\n/* Legacy frost opt-ins are now no-ops (glassmorphism removed) */\n.glass--frost, .glass--strong { -webkit-backdrop-filter: none; backdrop-filter: none; }\n\n/* ============================================================================\n   MICRO-INTERACTIONS — snappy, spring-eased feedback on every control.\n   Add .interactive to any card/tile; .press to any button/pressable.\n   Respects reduced-motion.\n   ============================================================================ */\n.interactive {\n  transition: var(--tr-surface);\n  cursor: pointer;\n  will-change: transform;\n}\n.interactive:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }\n.interactive:active { transform: translateY(-1px) scale(0.995); transition-duration: var(--dur-snap); }\n\n.press {\n  transition: var(--tr-control);\n  will-change: transform;\n}\n.press:hover { transform: translateY(-1px); }\n.press:active { transform: translateY(0) scale(0.96); transition-duration: var(--dur-snap); }\n\n/* Accent focus ring — expressive, animated */\n.focus-ring:focus-visible {\n  outline: none;\n  box-shadow: 0 0 0 3px var(--agency-accent-ring);\n  transition: box-shadow var(--dur-fast) var(--ease-out);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .interactive, .press, .focus-ring, * {\n    transition-duration: 1ms !important;\n    animation-duration: 1ms !important;\n  }\n  .interactive:hover, .press:hover { transform: none; }\n}\n\n<\u002Fstyle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<script src=\"128ed9dd-6638-4eb6-9bf6-b689c4f82d02\"><\u002Fscript>\n<script src=\"b3aae019-759f-439e-9847-14ab36040a33\"><\u002Fscript>\n<script src=\"24e7eeee-d7d2-4335-8181-083e2e66310b\"><\u002Fscript>\n<style>\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  body { background: #eef2f8; font-family: Inter, system-ui, sans-serif; }\n  a { color: #404293; text-decoration: none; }\n  a:hover { color: #323373; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:#eef2f8;\">\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n    <dc-import name=\"GPL Login Final\" hint-size=\"100%,100vh\"><\u002Fdc-import>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ isRegister }}\">\n    <dc-import name=\"GPL Registration Final\" hint-size=\"100%,100vh\"><\u002Fdc-import>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ isOtp }}\">\n    <dc-import name=\"GPL OTP Verification\" hint-size=\"100%,100vh\"><\u002Fdc-import>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ isDashboard }}\">\n    <dc-import name=\"GPL Dashboard\" hint-size=\"100%,100vh\"><\u002Fdc-import>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;GPL indigo&quot;,&quot;Revenue blue&quot;,&quot;Finance emerald&quot;,&quot;Housing amber&quot;],&quot;default&quot;:&quot;GPL indigo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;inkTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Deep teal&quot;,&quot;Midnight navy&quot;,&quot;Graphite&quot;],&quot;default&quot;:&quot;Deep teal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;canvas&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Cool grey&quot;,&quot;Warm paper&quot;,&quot;Bright white&quot;],&quot;default&quot;:&quot;Cool grey&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Calm&quot;,&quot;Snappy&quot;,&quot;Playful&quot;],&quot;default&quot;:&quot;Snappy&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Feel&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Sharp&quot;,&quot;Soft (default)&quot;,&quot;Rounded&quot;],&quot;default&quot;:&quot;Soft (default)&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Feel&quot;}}\">\n// Single-page shell so the exported file can move between login, registration\n// and the dashboard without loading separate documents.\nconst ROUTES = [\n  { match: 'gpl otp', screen: 'otp' },\n  // Report an Issue and Help Chat are mounted inside the dashboard, never as pages.\n  { match: 'gpl report an issue', screen: 'dashboard' },\n  { match: 'gpl help chat', screen: 'dashboard' },\n  { match: 'gpl dashboard', screen: 'dashboard' },\n  { match: 'gpl registration', screen: 'register' },\n  { match: 'gpl login', screen: 'login' }\n];\n\nconst ACCENTS = {\n  'GPL indigo': ['#404293', '#323373', '64,66,147'],\n  'Revenue blue': ['#2563c9', '#1b4a9c', '37,99,201'],\n  'Finance emerald': ['#0f7a52', '#0b5c3e', '15,122,82'],\n  'Housing amber': ['#b45f16', '#8c4910', '180,95,22']\n};\nconst INKS = {\n  'Deep teal': ['#08181e', '#0e242c'],\n  'Midnight navy': ['#0d1730', '#16224208'.slice(0, 7)],\n  'Graphite': ['#1b1e24', '#262a31']\n};\nconst CANVAS = { 'Cool grey': '#eef2f8', 'Warm paper': '#f5f1ea', 'Bright white': '#ffffff' };\nconst MOTION = {\n  'Calm': { dur: '90ms', lift: '0px', press: '0.99', ease: 'ease-out' },\n  'Snappy': { dur: '160ms', lift: '-2px', press: '0.97', ease: 'cubic-bezier(0.16,1,0.3,1)' },\n  'Playful': { dur: '220ms', lift: '-4px', press: '0.95', ease: 'cubic-bezier(0.34,1.56,0.64,1)' }\n};\nconst SHAPE = { 'Sharp': '4px', 'Soft (default)': null, 'Rounded': '26px' };\n\nclass Component extends DCLogic {\n  state = { screen: 'login' };\n\n  // One injected sheet re-skins every screen at once: the pages carry their own\n  // inline --agency-* blocks, so the tweaks have to out-specify them.\n  paintTheme() {\n    const p = this.props;\n    const acc = ACCENTS[p.accent] || ACCENTS['GPL indigo'];\n    const ink = INKS[p.inkTone] || INKS['Deep teal'];\n    const canvas = CANVAS[p.canvas] || CANVAS['Cool grey'];\n    const m = MOTION[p.motion] || MOTION['Snappy'];\n    const shapeR = SHAPE[p.shape] !== undefined ? SHAPE[p.shape] : SHAPE['Soft (default)'];\n    const shapeCss = shapeR ? `\n      #dc-root section[data-screen-label], #dc-root [style*=\"border-radius:14px\"], #dc-root [style*=\"border-radius: 14px\"],\n      #dc-root [style*=\"border-radius:16px\"], #dc-root [style*=\"border-radius: 16px\"] { border-radius: ${shapeR} !important; }\n      #dc-root [role=\"button\"], #dc-root button, #dc-root input, #dc-root [style*=\"border-radius:999px\"], #dc-root [style*=\"border-radius: 999px\"] { border-radius: ${shapeR === '4px' ? '4px' : shapeR} !important; }\n    ` : '';\n    const css = `\n      #dc-root [role=\"button\"], #dc-root button, #dc-root a, #dc-root .interactive, #dc-root input, #dc-root select {\n        transition: transform ${m.dur} ${m.ease}, box-shadow ${m.dur} ${m.ease}, background-color ${m.dur} ${m.ease}, border-color ${m.dur} ${m.ease}, color ${m.dur} ${m.ease} !important;\n      }\n      #dc-root [role=\"button\"]:hover, #dc-root button:hover, #dc-root .interactive:hover {\n        transform: translateY(${m.lift});\n      }\n      #dc-root [role=\"button\"]:active, #dc-root button:active, #dc-root .interactive:active {\n        transform: scale(${m.press});\n      }\n      ${shapeCss}\n      #dc-root [style*=\"--agency-accent\"] {\n        --agency-accent: ${acc[0]} !important;\n        --agency-accent-strong: ${acc[1]} !important;\n        --agency-accent-soft: rgba(${acc[2]},0.12) !important;\n        --agency-accent-ring: rgba(${acc[2]},0.30) !important;\n        --agency-tint: ${acc[0]} !important;\n      }\n      #dc-root a { color: ${acc[0]}; }\n      #dc-root a:hover { color: ${acc[1]}; }\n      #dc-root [style*=\"background: rgb(64, 66, 147)\"],\n      #dc-root [style*=\"background-color: rgb(64, 66, 147)\"] { background-color: ${acc[0]} !important; }\n      #dc-root [style*=\"background: rgb(8, 24, 30)\"],\n      #dc-root [style*=\"background-color: rgb(8, 24, 30)\"] { background-color: ${ink[0]} !important; }\n      #dc-root [style*=\"background: rgb(14, 36, 44)\"],\n      #dc-root [style*=\"background-color: rgb(14, 36, 44)\"] { background-color: ${ink[1]} !important; }\n      body,\n      #dc-root [style*=\"background: rgb(238, 242, 248)\"],\n      #dc-root [style*=\"background-color: rgb(238, 242, 248)\"] { background-color: ${canvas} !important; }\n    `;\n    let el = document.getElementById('gpl-tweak-theme');\n    if (!el) {\n      el = document.createElement('style');\n      el.id = 'gpl-tweak-theme';\n      document.head.appendChild(el);\n    }\n    el.textContent = css;\n  }\n\n  componentDidUpdate() { this.paintTheme(); }\n\n  componentDidMount() {\n    this.paintTheme();\n    this.onClick = (e) => {\n      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n      if (!a) return;\n      const href = decodeURIComponent(a.getAttribute('href') || '').toLowerCase();\n      if (!href || href.charAt(0) === '#' || href.indexOf('tel:') === 0 || href.indexOf('mailto:') === 0) return;\n      const hit = ROUTES.find(r => href.indexOf(r.match) !== -1);\n      if (!hit) return;\n      e.preventDefault();\n      e.stopPropagation();\n      window.scrollTo(0, 0);\n      this.setState({ screen: hit.screen });\n    };\n    document.addEventListener('click', this.onClick, true);\n  }\n\n  componentWillUnmount() { document.removeEventListener('click', this.onClick, true); }\n\n  renderVals() {\n    const s = this.state.screen;\n    return { isLogin: s === 'login', isRegister: s === 'register', isOtp: s === 'otp', isDashboard: s === 'dashboard' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
